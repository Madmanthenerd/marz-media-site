name: email-assets
on:
  push:
    branches: [email-assets]
    paths: [email-assets/urls.tsv, .github/workflows/email-assets.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Check every URL and make thumbnails
        run: |
          mkdir -p email-assets/thumbs
          : > email-assets/status.tsv
          while IFS=$'\t' read -r key url; do
            code=$(curl -s -L -o /tmp/img -w "%{http_code}" "$url")
            echo -e "$key\t$code" >> email-assets/status.tsv
            if [ "$code" = "200" ]; then python3 -c "from PIL import Image,ImageOps;import sys;ImageOps.fit(Image.open('/tmp/img').convert('RGB'),(240,160)).save(sys.argv[1],quality=72)" "email-assets/thumbs/$key.jpg" || true; fi
          done < email-assets/urls.tsv
          cut -f2 email-assets/status.tsv | sort | uniq -c
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add email-assets
          git commit -m "URL check + thumbnails"
          git push
