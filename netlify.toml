# Netlify hosts the public website (built from site/build.mjs) and the Stripe invoice webhook.
# Bookings, the calendar and the dashboard stay on Alex's Wix site, which the booking page talks to.
[build]
  command = "node site/build.mjs \"$COMMIT_REF\" --live --local"
  publish = "site/dist"
  functions = "netlify/functions"

# The Google Maps browser key is public by design (it ships to every visitor and is locked to
# Alex's websites), so the secrets scanner should not block deploys over it.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAaP8RKFizdXk4HfoGnNJIQlqZ0iNxm9no"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Old Wix page addresses -> their new pages (keeps Google rankings and old links working).
[[redirects]]
  from = "/about-me"
  to = "/about"
  status = 301
[[redirects]]
  from = "/faq"
  to = "/services"
  status = 301
[[redirects]]
  from = "/retainers"
  to = "/services"
  status = 301
[[redirects]]
  from = "/listings"
  to = "/portfolio"
  status = 301
[[redirects]]
  from = "/book-online"
  to = "/book"
  status = 301
[[redirects]]
  from = "/payment-request-page"
  to = "/book"
  status = 301
[[redirects]]
  from = "/service-page/social-media-reel"
  to = "/book?type=content"
  status = 301
[[redirects]]
  from = "/service-page/*"
  to = "/book"
  status = 301
[[redirects]]
  from = "/pricing-plans/*"
  to = "/services"
  status = 301
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301
[[redirects]]
  from = "/accessibility-statement"
  to = "/accessibility"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
